# Pulso + PostgreSQL. Uso: docker compose up --build   ->   http://localhost:5310
services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulso
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso -d pulso"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - dados:/var/lib/postgresql/data

  pulso:
    build: .
    ports:
      - "5310:5310"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      PULSO_BANCO_URL: jdbc:postgresql://banco:5432/pulso
      PULSO_BANCO_USUARIO: pulso
      PULSO_BANCO_SENHA: pulso
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados:

spring.application.name=pulso
server.port=${PORT:5310}

# H2 em arquivo na pasta do usuário (~/.pulso). Para PostgreSQL use o perfil "postgres".
spring.datasource.url=jdbc:h2:file:~/.pulso/banco;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# O esquema vem das migrações do Flyway; o Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
# Cada requisição registra o SQL que o Hibernate executou (painel "Por dentro do JPA").
spring.jpa.properties.hibernate.session_factory.statement_inspector=dev.barboza.pulso.rastro.InspetorDeSql

spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Rede de academias fictícia e movimento de exemplo na primeira execução.
pulso.demo=true
# Entradas e saídas simuladas na catraca, para o painel ao vivo se mexer.
pulso.simulador=true
pulso.abrir-navegador=false

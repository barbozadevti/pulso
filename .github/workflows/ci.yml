name: CI

on:
  push:
  pull_request:

jobs:
  testes-h2:
    name: Testes (H2) e teste de fumaça
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes e empacotamento
        run: mvn -B verify
      - name: Teste de fumaça do jar (site, API e painel)
        run: |
          java -jar target/pulso.jar --spring.datasource.url=jdbc:h2:mem:fumaca --pulso.simulador=false &
          for i in $(seq 1 120); do curl -sf http://localhost:5310/health && break; sleep 1; done
          curl -sf http://localhost:5310/ | grep -q "<title>Pulso</title>"
          curl -sf http://localhost:5310/v3/api-docs | grep -q "Pulso"
          # sem login, a API responde 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5310/api/painel)" = "401"
          # login da diretoria (sessão + CSRF) e chamadas protegidas
          curl -s -c c.txt -b c.txt http://localhost:5310/api/auth/csrf > /dev/null
          TOKEN=$(grep XSRF-TOKEN c.txt | awk '{print $7}')
          curl -sf -c c.txt -b c.txt -H "X-XSRF-TOKEN: $TOKEN" -H 'Content-Type: application/json' \
            -d '{"login":"diretoria@pulso.dev","senha":"Pulso@2026"}' http://localhost:5310/api/auth/entrar | grep -q DIRETORIA
          curl -sf -b c.txt http://localhost:5310/api/painel | grep -q "receitaRecorrente"
          curl -sf -b c.txt http://localhost:5310/api/laboratorio/n-mais-um | grep -q "INGENUO"
